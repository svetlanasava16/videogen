# Проверки движка на каждый push: typecheck, validate (все эпизоды), golden (эталонные кадры отладочного набора).
# Golden рендерится в контейнере tests/golden-env (linux/amd64) — в том же, где эталоны снимаются локально (pnpm golden:docker):
# растеризация текста в Chrome на macOS и Linux разная, поэтому эталоны снимаются только в контейнере. Шрифт Inter вшит.
name: engine

on:
  push:
    branches: [joke-factory-pipeline, main]
  pull_request:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate episodes
        run: pnpm validate --quiet

      - name: Golden frames (same Linux container as pnpm golden:docker locally)
        run: bash tests/golden-env/golden.sh

      - name: Golden report
        if: always()
        run: cat out/golden/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: out/golden
          retention-days: 7
